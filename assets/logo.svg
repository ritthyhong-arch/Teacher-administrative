<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="100%" height="100%">
  <defs>
    <linearGradient id="psisGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCEE21"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#AA7C11"/>
    </linearGradient>
    <linearGradient id="psisBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B365D"/>
      <stop offset="100%" stop-color="#0A192F"/>
    </linearGradient>
    <linearGradient id="psisRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#990000"/>
      <stop offset="100%" stop-color="#660000"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Outer Ring with Gold Border -->
  <circle cx="160" cy="160" r="150" fill="url(#psisBlue)" stroke="url(#psisGold)" stroke-width="8" filter="url(#shadow)"/>
  <circle cx="160" cy="160" r="138" fill="none" stroke="#D4AF37" stroke-width="2" stroke-dasharray="4,3"/>
  <circle cx="160" cy="160" r="115" fill="url(#psisRed)" stroke="url(#psisGold)" stroke-width="4"/>

  <!-- Radiating Rays of Wisdom -->
  <g stroke="rgba(255,215,0,0.3)" stroke-width="1.5">
    <line x1="160" y1="50" x2="160" y2="70"/>
    <line x1="160" y1="270" x2="160" y2="250"/>
    <line x1="50" y1="160" x2="70" y2="160"/>
    <line x1="270" y1="160" x2="250" y2="160"/>
    <line x1="82" y1="82" x2="96" y2="96"/>
    <line x1="238" y1="238" x2="224" y2="224"/>
    <line x1="82" y1="238" x2="96" y2="224"/>
    <line x1="238" y1="82" x2="224" y2="96"/>
  </g>

  <!-- Central Flame / Wisdom Torch -->
  <path d="M160 85 C155 105, 142 118, 142 132 C142 145, 150 152, 160 152 C170 152, 178 145, 178 132 C178 118, 165 105, 160 85 Z" fill="url(#psisGold)"/>
  <path d="M160 98 C157 110, 149 119, 149 128 C149 136, 154 141, 160 141 C166 141, 171 136, 171 128 C171 119, 163 110, 160 98 Z" fill="#FFF275"/>

  <!-- Open Book of Knowledge -->
  <g transform="translate(160, 175)">
    <!-- Book Pages -->
    <path d="M0 10 C-25 -5, -60 -5, -75 5 L-75 42 C-60 32, -25 32, 0 47 C25 32, 60 32, 75 42 L75 5 C60 -5, 25 -5, 0 10 Z" fill="#FFFFFF" stroke="#D4AF37" stroke-width="2.5"/>
    <!-- Page lines -->
    <path d="M-65 15 C-50 8, -25 8, -8 20 M-65 25 C-50 18, -25 18, -8 30 M-65 35 C-50 28, -25 28, -8 40" stroke="#1B365D" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M65 15 C50 8, 25 8, 8 20 M65 25 C50 18, 25 18, 8 30 M65 35 C50 28, 25 28, 8 40" stroke="#1B365D" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Book Spine -->
    <line x1="0" y1="10" x2="0" y2="47" stroke="#D4AF37" stroke-width="3"/>
  </g>

  <!-- Olive / Laurel Branches -->
  <path d="M85 210 Q70 180 80 150 Q90 120 110 105" fill="none" stroke="url(#psisGold)" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M235 210 Q250 180 240 150 Q230 120 210 105" fill="none" stroke="url(#psisGold)" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Curved Text Path Top: សាលាបញ្ញាសាស្រ្តអន្តរជាតិ -->
  <path id="textPathTop" d="M 45 160 A 115 115 0 0 1 275 160" fill="none"/>
  <!-- Curved Text Path Bottom: PAÑÑĀSĀSTRA INTERNATIONAL SCHOOL -->
  <path id="textPathBottom" d="M 275 160 A 115 115 0 0 1 45 160" fill="none"/>

  <text font-family="'Moul', 'Khmer OS Moul', serif" font-size="12.5" fill="#FCEE21" font-weight="bold">
    <textPath href="#textPathTop" startOffset="50%" text-anchor="middle">
      សាលាបញ្ញាសាស្រ្តអន្តរជាតិ
    </textPath>
  </text>

  <text font-family="'Montserrat', 'Arial', sans-serif" font-size="9" font-weight="800" fill="#FFFFFF" letter-spacing="1.5">
    <textPath href="#textPathBottom" startOffset="50%" text-anchor="middle">
      PAÑÑĀSĀSTRA INTL SCHOOL
    </textPath>
  </text>

  <!-- Stars -->
  <polygon points="160,225 163,233 171,233 165,238 167,246 160,241 153,246 155,238 149,233 157,233" fill="url(#psisGold)"/>
  <polygon points="135,228 137,234 143,234 138,238 140,244 135,240 130,244 132,238 127,234 133,234" fill="url(#psisGold)"/>
  <polygon points="185,228 187,234 193,234 188,238 190,244 185,240 180,244 182,238 177,234 183,234" fill="url(#psisGold)"/>
</svg>
